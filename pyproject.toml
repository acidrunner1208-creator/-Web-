[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-simulator"
version = "2.0.0"
description = "中央競馬の週末レースをモンテカルロ・シミュレーションし勝率・買い方の的中率を静的サイトで配信"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
