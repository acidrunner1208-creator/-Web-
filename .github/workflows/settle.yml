name: settle-and-learn

on:
  schedule:
    - cron: "0 14 * * 6"    # 土 23:00 JST — 当日レース確定後
    - cron: "0 14 * * 0"    # 日 23:00 JST
    - cron: "0 2 * * 1"     # 月 11:00 JST — 取りこぼし回収
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore scrape cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: scrape-cache-${{ github.run_id }}
          restore-keys: scrape-cache-
      - name: Settle results + incremental learning
        env:
          USER_AGENT: ${{ secrets.USER_AGENT }}
          REQUEST_DELAY_SECONDS: "2.5"
        run: python -m builder.settle
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ledger.json builder/model/state
          git commit -m "settle: results + model update $(date -u +%FT%TZ)" || echo "no changes"
          git pull --rebase --autostash || true
          git push
