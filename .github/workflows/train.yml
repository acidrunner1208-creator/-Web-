name: bootstrap-train

# 過去レースを一括収集して学習モデルをゼロから作る (時間がかかるため手動実行)。
# 期間を分けて複数回に分けて実行してよい (毎回 history に追記して全体で学習し直す)。
on:
  workflow_dispatch:
    inputs:
      from:
        description: "開始日 YYYY-MM-DD"
        required: true
      to:
        description: "終了日 YYYY-MM-DD"
        required: true
      max_races:
        description: "この実行で新規取り込む上限 (例: 800)"
        required: false
        default: "600"

concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore scrape cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: train-cache-${{ github.run_id }}
          restore-keys: train-cache-
      - name: Train
        env:
          USER_AGENT: ${{ secrets.USER_AGENT }}
          REQUEST_DELAY_SECONDS: "2.5"
        run: |
          python -m builder.model.train \
            --from "${{ github.event.inputs.from }}" \
            --to "${{ github.event.inputs.to }}" \
            --max-races "${{ github.event.inputs.max_races }}"
      - name: Commit model state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builder/model/state
          git commit -m "train: bootstrap ${{ github.event.inputs.from }}..${{ github.event.inputs.to }}" || echo "no changes"
          git pull --rebase --autostash || true
          git push
